<!DOCTYPE html>
<html>

<head>
<title>Aplikacja RPG - prototyp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"></script>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.72/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.72/vfs_fonts.js"></script>
</head>


<body>
  <header class="app-header">
    <div>
      <h1>Aplikacja RPG</h1>
      <p>Generator treści i panel kampanii dla Mistrza Gry</p>
    </div>
    <button id="logout-button" class="secondary hidden">Wyloguj</button>
  </header>

  <main>
<section id="login-view" class="view">
  <div class="login-card">
    <h2>Logowanie</h2>
    <p class="muted">Zaloguj się do aplikacji, aby zarządzać kampaniami i materiałami RPG.</p>

    <form id="login-form">
      <label for="login-email">Adres e-mail</label>
      <input id="login-email" type="email" placeholder="Wpisz adres e-mail">

      <label for="login-password">Hasło</label>
      <input id="login-password" type="password" placeholder="Wpisz hasło">

      <button type="submit">Zaloguj</button>
    </form>

    <div class="demo-accounts">
      <p>Konta testowe do demonstracji:</p>
      <button type="button" id="fill-gm" class="secondary">Użyj konta Mistrza Gry</button>
      <button type="button" id="fill-player" class="secondary">Użyj konta gracza</button>
    </div>

    <p id="login-message"></p>
  </div>
</section>

    <section id="app-view" class="view hidden">
      <aside class="sidebar">
        <button data-view="dashboard">Panel</button>
        <button data-view="campaigns">Kampanie</button>
        <button data-view="generator">Generator</button>
        <button data-view="materials">Materiały</button>
        <button data-view="player">Widok gracza</button>
      </aside>

      <section class="content">
        <section id="dashboard-view" class="panel"></section>
        <section id="campaigns-view" class="panel hidden"></section>

        <section id="generator-view" class="panel hidden">
          <h2>Generator treści RPG</h2>

          <!-- tu zostają elementy wymagane przez stary script.js -->
          <div id="form-container">
            <div id="select-column">
              <select id="kategoria">
                  <option value="MBCharacter" selected>Postać - Mörk Borg</option>
                    <option value="currentEnemy">Przeciwnik do aktualnej przygody</option>
                    <option value="MBUnheroicFeats">Atuty - Mörk Borg</option>
                    <option value="Goal">Cele postaci</option>
                    <option value="whatConnectsUs">Co nas łączy? - Mörk Borg</option>
                    <option value="MBCorpseLoot">Grabienie - Mörk Borg</option>
                    <option value="MBNames">Imiona - Mörk Borg</option>
                    <option value="MBNobleNames">Imiona arystokratyczne- Mörk Borg</option>
                    <option value="VOTENobleNames">Imiona arystokratyczne - VotE</option>
                    <option value="MBPaleOneNames">Imiona Bladawców - Mörk Borg</option>
                    <option value="maleGaelicNames">Imiona celtyckie - męskie</option>
                    <option value="wizardNames">Imiona czarodziejów - Pamiętliwe Krainy</option>
                    <option value="maleLatinNames">Imiona łacińskie - męskie</option>
                    <option value="crusaderNames">Imiona krzyżowców</option>
                    <option value="WHFMaleHumanNames">Imiona męskie - Warhammer Fantasy</option>
                    <option value="unsulliedNames">Imiona Nieskalanych - ASOIAF (eng.)</option>
                    <option value="orkishNames">Imiona orków</option>
                    <option value="maleRussianNames">Imiona rosyjskie - męskie (transl. ang.)</option>
                    <option value="maleSlavicNames">Imiona słowiańskie - męskie</option>
                    <option value="mercenaryCompanies">Kompanie najemników (eng.)</option>
                    <option value="MBRandomDiscoveriesCivilized">Losowe odkrycia cywilizacja - Mörk Borg</option>
                    <option value="MBRandomDiscoveriesWilderness">Losowe odkrycia dzicz - Mörk Borg</option>
                    <option value="MBRandomEncountersCivilized">Losowe spotkania cywilizacja - Mörk Borg</option>
                    <option value="MBRandomEncountersWilderness">Losowe spotkania dzicz - Mörk Borg</option>
                    <option value="MBTownEncounters">Losowe spotkania w mieście - Mörk Borg</option>
                    <!-- 
            <option value="MBRandomEncountersGravenTosk">Losowe spotkania - Graven-Tosk - MB</option>
            <option value="MBRandomEncountersShadowKing">Losowe spotkania - Pałac Króla Cieni - MB</option>
            <option value="MBRandomEncountersSarkash">Losowe spotkania - Sarkash - MB</option>
            <option value="MBRandomEncounters">Losowe spotkania - Tveland - MB</option> -->
                    <option value="MBArcaneCatastrophes">Magiczne katastrofy - Mörk Borg</option>
                    <option value="MBDeadGod">Martwy Bóg - Mörk Borg</option>
                    <option value="MBTowns">Miasta, nazwy - Mörk Borg</option>
                    <option value="MBTownsDesc">Miejscowości - Mörk Borg</option>
                    <option value="mutations">Mutacje</option>
                    <option value="MBFollower">Najmita - Mörk Borg</option>
                    <option value="wildClanNames">Nazwy dzikich klanów</option>
                    <option value="tavernNames">Nazwy Karczm</option>
                    <option value="MBCultNames">Nazwy Kultów - Mörk Borg</option>
                    <option value="MBMiseriesEN">Niedole - Mörk Borg (eng.)</option>
                    <option value="MBMiseriesPL">Niedole - Mörk Borg (pl.)</option>
                    <option value="MBTroublingTales">Niepokojące historie - Mörk Borg</option>
                    <option value="unfriendlyUndead">Nieprzyjazny nieumarły - Mörk Borg (Kill Your Necromancer)</option>
                    <option value="description">Opis fabularny</option>
                    <option value="MBTerribleTraits">Okropne cechy - Mörk Borg</option>
                    <option value="MBClasslessOrigin">Pochodzenie postaci bezklasowej - Mörk Borg</option>
                    <option value="MBWeather">Pogoda - Mörk Borg</option>
                    <option value="MBCharacter">Postać - Mörk Borg</option>
                    <option value="MBMonsters">Potwory - Mörk Borg</option>
                    <option value="medievalProfessions">Profesja średniowieczna</option>
                    <option value="MBTreasure">Skarby - Mörk Borg</option>
                    <option value="MBBrokenBodies">Zniszczone ciała - Mörk Borg</option>
                    <option value="MBBadHabits">Złe nawyki - Mörk Borg</option>
                    <option value="MBUncleanScroll">Zwój (przeklęty) - Mörk Borg</option>
                    <option value="MBSacredScroll">Zwój (święty) - Mörk Borg</option>
              </select>
              <label for="liczba">Liczba wyników</label>
              <input id="liczba" type="number" min="1" max="100" value="1">
            </div>

            <button id="generate-button">Generuj</button>
            <div id="name-display"></div>
          </div>

<div class="save-box">
  <div class="save-row">
    <select id="campaign-select"></select>

    <label class="share-label">
      <input type="checkbox" id="share-content">
      Udostępnij treść graczom
    </label>

    <label class="share-label">
      <input type="checkbox" id="share-comment">
      Pokaż komentarz graczom
    </label>

    <button id="save-content">Zapisz do kampanii</button>
  </div>

  <label for="gm-comment" class="field-label">Komentarz Mistrza Gry</label>
  <textarea
    id="gm-comment"
    rows="3"
    placeholder="Opcjonalny komentarz, np. „to, co znaleźliście w skrzyni” albo prywatna notatka MG."
  ></textarea>

  <p id="save-message"></p>
</div>

        </section> <!-- koniec generator-view -->

        <section id="materials-view" class="panel hidden"></section>
        <section id="player-view" class="panel hidden"></section>
      </section> <!-- koniec content -->
    </section> <!-- koniec app-view -->
  </main>
<footer class="invisible">
  <p>Materiały demonstracyjne do prototypu aplikacji RPG.</p>
</footer>
  <script type="module" src="script.js"></script>
  <script type="module" src="mock-app.js"></script>
</body>
</html>
